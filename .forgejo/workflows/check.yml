name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: docker
    container:
      # The oldest Python the package supports (requires-python >= 3.11).
      image: python:3.11-bookworm
    steps:
      # actions/checkout is a JavaScript action; the Python image has no node.
      - run: apt-get update && apt-get install -y --no-install-recommends nodejs
      - uses: actions/checkout@v4
      - run: pip install uv==0.13.10
      - run: make install
      # Chromium's system libraries, for the browser tests.
      - run: uv run playwright install-deps chromium
      - run: make check
