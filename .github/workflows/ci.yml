name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Actions > CI > Run workflow: every OS, for a branch that touches
  # platform code before its release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux for every pull request and push to main. macOS and Windows
        # minutes cost far more, so they run for a release's pull request
        # (a release/* branch) and when run by hand.
        os: >-
          ${{ fromJSON(
            (startsWith(github.head_ref, 'release/')
              || github.event_name == 'workflow_dispatch')
            && '["ubuntu-latest", "macos-latest", "windows-latest"]'
            || '["ubuntu-latest"]'
          ) }}
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-extras
      - run: uv run pytest -m "not browser" --cov --cov-report=term

  # The browser client is the same JavaScript everywhere: one browser, one OS.
  browser:
    name: Browser client in Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --all-extras
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser
